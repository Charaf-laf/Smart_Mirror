<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Mirror</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --bg: #02040a;
        --fg: #f5f5f5;
        --accent: #4fd1c5;
        --muted: #a0a0a0;
        --danger: #f56565;
        --success: #48bb78;
        --card-bg: rgba(8, 10, 20, 0.75);
        --card-border: rgba(255, 255, 255, 0.06);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #02040a;
        color: var(--fg);
        font-family: system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        position: relative;
        transition: filter 1s ease;
      }
      body.sleep-mode {
        filter: brightness(0.35);
      }

      /* === GLOBAL GLOW FOR ALMOST ALL TEXT === */
      body,
      body * {
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.18);
      }

      /* --- ANIMATION LAYER --- */
      #animation-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: screen;
      }

      /* --- CONFETTI CSS --- */
      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #f0f;
        top: -10px;
        z-index: 50;
        pointer-events: none;
        opacity: 0.8;
      }
      @keyframes fall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }

      /* --- ANIMATION KEYFRAMES --- */
      @keyframes pulse-happy {
        0% {
          opacity: 0;
          background: radial-gradient(
            circle at center,
            rgba(255, 215, 0, 0.4) 0%,
            transparent 50%
          );
        }
        20% {
          opacity: 1;
          transform: scale(1);
        }
        80% {
          opacity: 0.8;
          transform: scale(1.1);
        }
        100% {
          opacity: 0;
          transform: scale(1.2);
        }
      }
      @keyframes pulse-sad {
        0% {
          opacity: 0;
          background: radial-gradient(
            circle at center,
            rgba(0, 100, 255, 0.25) 0%,
            transparent 70%
          );
        }
        50% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes pulse-angry {
        0% {
          opacity: 0;
          background: radial-gradient(
            circle at center,
            rgba(255, 50, 50, 0.35) 0%,
            transparent 60%
          );
        }
        10% {
          opacity: 1;
        }
        40% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes pulse-surprise {
        0% {
          opacity: 0;
          background: radial-gradient(
            circle at center,
            rgba(255, 0, 255, 0.3) 0%,
            transparent 60%
          );
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes pulse-neutral {
        0% {
          opacity: 0;
          background: radial-gradient(
            circle at center,
            rgba(255, 255, 255, 0.1) 0%,
            transparent 60%
          );
        }
        50% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
        }
      }

      .anim-happy {
        animation: pulse-happy 6s ease-out forwards;
      }
      .anim-sad {
        animation: pulse-sad 8s ease-in-out forwards;
      }
      .anim-angry {
        animation: pulse-angry 4s ease-out forwards;
      }
      .anim-surprise {
        animation: pulse-surprise 5s ease-out forwards;
      }
      .anim-neutral {
        animation: pulse-neutral 6s ease-in-out forwards;
      }

      .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at top left,
          #191f3d 0,
          #02040a 60%
        );
        z-index: -2;
      }

      .mirror-root {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 24px 32px;
        position: relative;
        z-index: 10;
      }

      header.top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
      }
      .clock-block {
        display: flex;
        flex-direction: column;
      }
      .time {
        font-size: 4.6rem;
        font-weight: 300;
        letter-spacing: 0.16em;
        /* STRONGER GLOW FOR TIME */
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }
      .date {
        font-size: 1.1rem;
        margin-top: 4px;
        color: var(--muted);
      }

      .top-right {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
      }
      .card {
        background: var(--card-bg);
        border-radius: 20px;
        border: 1px solid var(--card-border);
        padding: 14px 18px;
        box-shadow: 0 0 22px rgba(0, 0, 0, 0.6);
        min-width: 260px;
        backdrop-filter: blur(5px);
      }
      .card-title {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .weather-temp {
        font-size: 2rem;
        font-weight: 300;
      }
      .weather-desc {
        font-size: 0.9rem;
        color: var(--muted);
      }
      .weather-meta {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 4px;
      }
      .weather-location {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 6px;
        text-align: right;
      }

      .emotion-name {
        font-size: 2rem;
        font-weight: 400;
        margin-bottom: 4px;
      }
      .emotion-confidence {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      body.emotion-positive .center-message .message-text {
        text-shadow: 0 0 20px rgba(72, 187, 120, 0.8);
      }
      body.emotion-neutral .center-message .message-text {
        text-shadow: 0 0 15px rgba(156, 163, 175, 0.6);
      }
      body.emotion-negative .center-message .message-text {
        text-shadow: 0 0 20px rgba(245, 101, 101, 0.8);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
      }
      .face-on .status-dot {
        background: var(--success);
        box-shadow: 0 0 10px var(--success);
      }
      .face-off .status-dot {
        background: #4a5568;
      }

      .confirm-bar {
        margin-top: 10px;
        display: none;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .confirm-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.8rem;
        color: var(--fg);
        cursor: pointer;
        transition: background 0.2s;
      }
      .confirm-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .center-message {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .message-text {
        font-size: 2.3rem;
        font-weight: 300;
        max-width: 900px;
        transition: text-shadow 0.5s;
        /* DEFAULT GLOW FOR MAIN MESSAGE */
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
      }
      .emotion-tag {
        color: var(--accent);
        font-size: 1rem;
        margin-top: 12px;
        letter-spacing: 0.25em;
        display: inline-block;
        text-transform: uppercase;
      }

      .feedback-stats {
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .mood-summary {
        position: fixed;
        right: 32px;
        top: 80px;
        max-width: 320px;
        background: rgba(8, 10, 20, 0.95);
        border-radius: 16px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
        font-size: 0.85rem;
      }

      .video-block {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .camera-greeting {
        text-align: center;
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;

        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);

        padding: 10px 20px;
        border-radius: 50px;
        margin-bottom: 15px;

        opacity: 0;
        pointer-events: none;
        transform: translateY(30px) scale(0.95);
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .camera-greeting--visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        animation: glowPulse 2s infinite ease-in-out;
      }

      @keyframes glowPulse {
        0% {
          box-shadow: 0 0 10px rgba(79, 209, 197, 0.2);
          border-color: rgba(255, 255, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 20px rgba(79, 209, 197, 0.5);
          border-color: rgba(79, 209, 197, 0.6);
        }
        100% {
          box-shadow: 0 0 10px rgba(79, 209, 197, 0.2);
          border-color: rgba(255, 255, 255, 0.2);
        }
      }

      .camera-overlay {
        position: fixed;
        left: 32px;
        bottom: 80px;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .camera-frame {
        width: 220px;
        border-radius: 16px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.7);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.9);
        opacity: 0.4;
      }

      footer {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 1rem;
        align-items: center;
        margin-top: 10px;
      }

      .connection-indicator {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .connection-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #4a5568;
      }
      .connection-online .connection-dot {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
      }
      .connection-offline .connection-dot {
        background: var(--danger);
      }

      .radio-station {
        font-size: 1rem;
        margin-bottom: 4px;
      }
      .radio-extra {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .radio-controls {
        display: flex;
        gap: 8px;
      }
      .radio-btn {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: var(--fg);
        font-size: 0.8rem;
        padding: 4px 9px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .radio-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>

  <body>
    <div class="bg-gradient"></div>
    <div id="animation-layer"></div>
    <div class="mirror-root">
      <header class="top-bar">
        <div class="clock-block">
          <div id="time" class="time">--:--</div>
          <div id="date" class="date">Lädt…</div>
        </div>

        <div class="top-right">
          <div class="card">
            <div class="card-title">Weather</div>
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-desc" id="weatherDesc">Loading…</div>
            <div class="weather-meta" id="weatherMeta1">Feels: --°C</div>
            <div class="weather-meta" id="weatherMeta2">Humidity: --%</div>
            <div class="weather-location" id="weatherLocation">City</div>
          </div>

          <div class="card">
            <div class="card-title">Emotion</div>
            <div id="emotionName" class="emotion-name">--</div>
            <div id="emotionConfidence" class="emotion-confidence"></div>

            <div id="faceStatus" class="status-pill face-off">
              <span class="status-dot"></span>
              <span id="faceStatusText">Kein Gesicht</span>
            </div>

            <div id="confirmBar" class="confirm-bar">
              <span id="confirmText">Lag ich damit richtig?</span>
              <button class="confirm-btn" onclick="sendFeedback(true)">
                👍 Ja
              </button>
              <button class="confirm-btn" onclick="sendFeedback(false)">
                👎 Nein
              </button>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Radio</div>
            <div id="radioStation" class="radio-station">
              Kein Sender ausgewählt
            </div>
            <div id="radioExtra" class="radio-extra">
              Nutze die Buttons, um zu starten.
            </div>
            <div class="radio-controls">
              <button class="radio-btn" onclick="radioPrev()">◀ Zurück</button>
              <button class="radio-btn" onclick="radioToggle()">
                ⏯ Play/Pause
              </button>
              <button class="radio-btn" onclick="radioNext()">Weiter ▶</button>
            </div>
            <audio id="radioPlayer"></audio>
          </div>
        </div>
      </header>

      <div class="center-message">
        <div id="messageText" class="message-text">
          Willkommen! Bitte tritt vor den Spiegel. ✨
          <span id="emotionTag" class="emotion-tag"></span>
        </div>
      </div>

      <div class="video-block">
        <div id="feedbackStats" class="feedback-stats">
          Noch keine bestätigten Emotionen.
        </div>

        <div id="moodSummary" class="mood-summary" style="display: none">
          <div class="mood-summary-title">Langzeit-Stimmung</div>
          <div id="moodSummaryText" class="mood-summary-text"></div>
        </div>
      </div>

      <div class="camera-overlay">
        <div id="greetingBanner" class="camera-greeting"></div>

        <div class="camera-frame">
          <img
            id="videoStream"
            src="/stream"
            style="width: 100%; height: auto"
          />
        </div>
      </div>

      <footer>
        <span>Smart Mirror</span>
        <span id="connectionIndicator" class="connection-indicator">
          <span id="connectionDot" class="connection-dot"></span>
          <span id="connectionText">Verbinde…</span>
        </span>
      </footer>
    </div>

    <script>
      /* UHR-FUNKTION */
      function updateClock() {
        const now = new Date();
        const hh = now.getHours().toString().padStart(2, "0");
        const mm = now.getMinutes().toString().padStart(2, "0");

        document.getElementById("time").textContent = `${hh}:${mm}`;
        document.getElementById("date").textContent = now.toLocaleDateString(
          undefined,
          {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          }
        );
      }
      updateClock();
      setInterval(updateClock, 1000);

      /* GLOBAL VARIABLES */
      let lastStableEmotion = null;
      let lastPromptTime = 0;
      let currentPromptEmotion = null;
      const PROMPT_INTERVAL_MS = 20_000;
      let lastFaceSeenTime = Date.now();

      const MY_NAME = "Charaf";
      const GREETING_DURATION_MS = 10_000;
      let greetingVisibleUntil = 0;
      let lastHasFace = false;

      let happyCount = 0;
      let happyWindowStart = Date.now();
      const HAPPY_WINDOW_MS = 60_000;

      let lastAnimationTime = 0;
      const ANIMATION_COOLDOWN_MS = 10000;

      /* === Emotion-based Music Files (same folder as this HTML) === */
      const emotionTracks = {
        happy: "AgusAlvarez & Luke Bergs - The Feeling (freetouse.com).mp3",
        happiness: "AgusAlvarez & Luke Bergs - The Feeling (freetouse.com).mp3",
        surprise: "Aylex - This Is Phonk (freetouse.com).mp3",
        surprised: "Aylex - This Is Phonk (freetouse.com).mp3",
        sad: "Zambolino - Way Back (freetouse.com).mp3",
        sadness: "Zambolino - Way Back (freetouse.com).mp3",
      };

      let lastMusicEmotion = null;

      function spawnConfetti() {
        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti");
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.backgroundColor = `hsl(${
            Math.random() * 360
          }, 100%, 70%)`;
          const duration = Math.random() * 3 + 2;
          confetti.style.animation = `fall ${duration}s linear forwards`;
          document.body.appendChild(confetti);
          setTimeout(() => {
            confetti.remove();
          }, duration * 1000);
        }
      }

      function mapEmotionLabel(short) {
        if (!short) return "";
        const l = short.toLowerCase();
        switch (l) {
          case "happy":
            return "Glücklich 😄";
          case "sad":
            return "Traurig 😢";
          case "angry":
            return "Wütend 😠";
          case "surprise":
            return "Überrascht 😮";
          case "fear":
            return "Ängstlich 😨";
          case "disgust":
            return "Angewidert 🤢";
          case "neutral":
            return "Neutral 😐";
          default:
            return short.charAt(0).toUpperCase() + short.slice(1);
        }
      }

      function triggerEmotionAnimation(emotion) {
        if (!emotion) return;

        const now = Date.now();
        if (now - lastAnimationTime < ANIMATION_COOLDOWN_MS) {
          return;
        }

        const layer = document.getElementById("animation-layer");
        const e = emotion.toLowerCase();

        layer.className = "";
        void layer.offsetWidth;

        let animClass = "";
        if (e === "happy" || e === "happiness") {
          animClass = "anim-happy";
          spawnConfetti();
        } else if (e === "sad" || e === "sadness") animClass = "anim-sad";
        else if (e === "angry" || e === "anger") animClass = "anim-angry";
        else if (e === "surprise") {
          animClass = "anim-surprise";
          spawnConfetti();
        } else if (e === "neutral") animClass = "anim-neutral";
        else return;

        layer.classList.add(animClass);
        lastAnimationTime = now;
      }

      async function fetchStatus() {
        try {
          const res = await fetch("/status", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          updateEmotionUI(data);
          updateConnectionStatus(true);
        } catch (err) {
          console.error("Status-Fehler:", err);
          updateConnectionStatus(false);
        }
      }

      function updateConnectionStatus(online) {
        const box = document.getElementById("connectionIndicator");
        const text = document.getElementById("connectionText");

        if (online) {
          box.classList.remove("connection-offline");
          box.classList.add("connection-online");
          text.textContent = "Online · Emotion-Engine bereit";
        } else {
          box.classList.remove("connection-online");
          box.classList.add("connection-offline");
          text.textContent = "Offline";
        }
      }

      function playEmotionMusicFor(emotion) {
        if (!emotion) return;

        const key = emotion.toLowerCase();
        const track = emotionTracks[key];
        if (!track) return;

        if (lastMusicEmotion === key) return;

        const player = document.getElementById("radioPlayer");
        if (!player) return;

        player.src = track;
        player.loop = true;
        player
          .play()
          .then(() => {
            // ok
          })
          .catch((e) => {
            console.error("Konnte Emotions-Musik nicht abspielen:", e);
          });

        lastMusicEmotion = key;

        const stationEl = document.getElementById("radioStation");
        const extraEl = document.getElementById("radioExtra");
        if (stationEl) stationEl.textContent = "Emotion Music";
        if (extraEl) extraEl.textContent = "Stimmung: " + emotion;
      }

      function updateEmotionUI(data) {
        const hasFace = data.has_face;
        const isCharaf = !!data.is_charaf;
        const rawEmotion = data.emotion;
        const stableEmotion = data.stable_emotion;
        const confidence = data.confidence;
        const message = data.message;
        const now = Date.now();

        const greetEl = document.getElementById("greetingBanner");

        if (hasFace && !lastHasFace) {
          if (isCharaf) {
            greetEl.innerHTML = `Hallo <span style="color:var(--accent)">${MY_NAME}</span>! 🌟`;
          } else {
            greetEl.innerHTML = "Hallo Random! 👋";
          }
          greetingVisibleUntil = now + GREETING_DURATION_MS;
          greetEl.classList.add("camera-greeting--visible");
        }

        if (!hasFace) {
          greetingVisibleUntil = 0;
          greetEl.classList.remove("camera-greeting--visible");
        } else if (now > greetingVisibleUntil) {
          greetEl.classList.remove("camera-greeting--visible");
        }

        lastHasFace = hasFace;

        document.body.classList.remove(
          "emotion-positive",
          "emotion-neutral",
          "emotion-negative"
        );
        const baseEmotion = stableEmotion || rawEmotion || null;
        if (baseEmotion) {
          const e = baseEmotion.toLowerCase();
          if (e === "happy" || e === "happiness" || e === "surprise") {
            document.body.classList.add("emotion-positive");
          } else if (e === "neutral") {
            document.body.classList.add("emotion-neutral");
          } else {
            document.body.classList.add("emotion-negative");
          }
        }

        if (stableEmotion && hasFace) {
          triggerEmotionAnimation(stableEmotion);
        }

        if (hasFace) {
          lastFaceSeenTime = now;
          document.body.classList.remove("sleep-mode");
        } else {
          if (now - lastFaceSeenTime > 5000) {
            document.body.classList.add("sleep-mode");
          } else {
            document.body.classList.remove("sleep-mode");
          }
        }

        const nameEl = document.getElementById("emotionName");
        let label = null;
        if (stableEmotion) {
          label = mapEmotionLabel(stableEmotion);
        } else if (rawEmotion) {
          label = mapEmotionLabel(rawEmotion);
        }
        nameEl.textContent = label || "--";

        const confEl = document.getElementById("emotionConfidence");
        if (typeof confidence === "number") {
          confEl.textContent = `(${(confidence * 100).toFixed(1)}%)`;
        } else {
          confEl.textContent = "";
        }

        const fs = document.getElementById("faceStatus");
        const fst = document.getElementById("faceStatusText");
        if (hasFace) {
          fs.classList.remove("face-off");
          fs.classList.add("face-on");
          fst.textContent = "Gesicht erkannt";
        } else {
          fs.classList.remove("face-on");
          fs.classList.add("face-off");
          fst.textContent = "Kein Gesicht";
        }

        const msgEl = document.getElementById("messageText");
        const tagEl = document.getElementById("emotionTag");

        msgEl.textContent =
          message || "Willkommen! Bitte tritt vor den Spiegel. ✨";

        if (stableEmotion) {
          tagEl.textContent = `Aktuelle Stimmung: ${mapEmotionLabel(
            stableEmotion
          )}`;
        } else if (rawEmotion) {
          tagEl.textContent = `Erster Eindruck: ${mapEmotionLabel(
            rawEmotion
          )}`;
        } else {
          tagEl.textContent = "";
        }
        msgEl.appendChild(tagEl);

        if (stableEmotion && stableEmotion !== lastStableEmotion) {
          lastStableEmotion = stableEmotion;
        }

        trackHappyOccurrences(stableEmotion);

        if (data.feedback_stats) {
          updateFeedbackStats(data.feedback_stats);
        }
        if (data.longterm_message) {
          showMoodSummary(data.longterm_message);
        }

        const emotionForPrompt = stableEmotion || rawEmotion || null;
        handleFeedbackPrompt(hasFace, emotionForPrompt);

        const emotionForMusic = stableEmotion || rawEmotion || null;
        if (emotionForMusic) {
          playEmotionMusicFor(emotionForMusic);
        }
      }

      function trackHappyOccurrences(stableEmotion) {
        const now = Date.now();
        if (now - happyWindowStart > HAPPY_WINDOW_MS) {
          happyWindowStart = now;
          happyCount = 0;
        }
        if (stableEmotion === "happy") {
          happyCount++;
        }
      }

      function updateFeedbackStats(stats) {
        const el = document.getElementById("feedbackStats");
        if (!el) return;
        const total = stats.total_correct || 0;
        if (total === 0) {
          el.textContent = "Noch keine bestätigten Emotionen.";
        } else {
          el.textContent =
            "Bestätigte Emotionserkennungen: " + total + ".";
        }
      }

      function showMoodSummary(text) {
        const box = document.getElementById("moodSummary");
        const txt = document.getElementById("moodSummaryText");
        if (!box || !txt) return;

        txt.textContent = text;
        box.style.display = "block";

        if (window.moodSummaryTimeout) {
          clearTimeout(window.moodSummaryTimeout);
        }
        window.moodSummaryTimeout = setTimeout(() => {
          box.style.display = "none";
        }, 8000);
      }

      function handleFeedbackPrompt(hasFace, emotion) {
        const bar = document.getElementById("confirmBar");
        const confirmText = document.getElementById("confirmText");
        const now = Date.now();

        if (!hasFace || !emotion) {
          bar.style.display = "none";
          return;
        }

        const enoughTime = now - lastPromptTime >= PROMPT_INTERVAL_MS;
        const emotionChanged = emotion !== currentPromptEmotion;

        if (!enoughTime && !emotionChanged) {
          return;
        }

        currentPromptEmotion = emotion;
        lastPromptTime = now;

        const label = emotion.charAt(0).toUpperCase() + emotion.slice(1);
        confirmText.textContent = `Lag ich richtig, dass du ${label} aussiehst?`;
        bar.style.display = "flex";
      }

      async function sendFeedback(correct) {
        try {
          const emotionElem = document.getElementById("emotionName");
          let emotion = emotionElem.textContent || "";
          emotion = emotion.toLowerCase();
          if (emotion === "--" || !emotion) return;

          const res = await fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              emotion: emotion,
              correct: !!correct,
            }),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (data.feedback_stats) {
            updateFeedbackStats(data.feedback_stats);
          }
        } catch (err) {
          console.error("Fehler beim Senden von Feedback:", err);
        } finally {
          const bar = document.getElementById("confirmBar");
          bar.style.display = "none";
        }
      }

      const WEATHER_API_KEY = "API_key";
      const WEATHER_CITY = "Berlin,de";

      async function fetchWeather() {
        try {
          const url =
            "https://api.openweathermap.org/data/2.5/weather?q=" +
            encodeURIComponent(WEATHER_CITY) +
            "&units=metric&appid=" +
            encodeURIComponent(WEATHER_API_KEY);

          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          document.getElementById("weatherTemp").textContent =
            data.main.temp.toFixed(1) + "°C";
          document.getElementById("weatherDesc").textContent =
            data.weather[0].description;
          document.getElementById("weatherMeta1").textContent =
            "Feels: " + data.main.feels_like.toFixed(1) + "°C";
          document.getElementById("weatherMeta2").textContent =
            "Humidity: " + data.main.humidity + "%";
          document.getElementById("weatherLocation").textContent =
            data.name + ", " + data.sys.country;
        } catch (e) {
          console.error("Weather error:", e);
          document.getElementById("weatherDesc").textContent = "Offline";
        }
      }

      fetchWeather();
      setInterval(fetchWeather, 600000);

      const stations = [
        {
          name: "Sender 1",
          description: "WDR1",
          url: "https://f141.rndfnk.com/ard/wdr/1live/live/mp3/128/stream.mp3?cid=01FBRZTS1K1TCD4KA2YZ1ND8X3&sid=36avcSQHnNwysFdA14hrhOvz2x9&token=k7PqNDU4XFDS4t_lDGuntLx0puxXJe5jX_Qm_filEn8&tvf=BcS6uA6IfxhmMTQxLnJuZGZuay5jb20",
        },
        {
          name: "Sender 2",
          description: "Noch ein Sender",
          url: "https://example.com/stream2",
        },
      ];

      let currentStationIndex = 0;
      let radioPlaying = false;

      function updateRadioUI() {
        const station = stations[currentStationIndex];
        const nameEl = document.getElementById("radioStation");
        const extraEl = document.getElementById("radioExtra");

        if (!station) {
          nameEl.textContent = "Kein Sender ausgewählt";
          extraEl.textContent = "Füge Sender im Code hinzu.";
          return;
        }

        nameEl.textContent = station.name;

        const desc = station.description || "";
        const statusText = radioPlaying ? " · Läuft" : " · Pause";
        extraEl.textContent = desc ? desc + statusText : "Radio" + statusText;
      }

      function radioPlayStation(index) {
        const player = document.getElementById("radioPlayer");
        const station = stations[index];
        if (!station) return;

        player.src = station.url;
        player
          .play()
          .then(() => {})
          .catch((e) => {
            console.error("Radio-Abspielfehler:", e);
          });
        radioPlaying = true;
        currentStationIndex = index;
        lastMusicEmotion = null;
        updateRadioUI();
      }

      function radioToggle() {
        const player = document.getElementById("radioPlayer");
        if (!player.src) {
          radioPlayStation(currentStationIndex);
          return;
        }
        if (radioPlaying) {
          player.pause();
          radioPlaying = false;
        } else {
          player
            .play()
            .then(() => {})
            .catch((e) => {
              console.error("Radio-Fortsetzen-Fehler:", e);
            });
          radioPlaying = true;
        }
        updateRadioUI();
      }

      function radioNext() {
        if (stations.length === 0) return;
        currentStationIndex = (currentStationIndex + 1) % stations.length;
        radioPlayStation(currentStationIndex);
      }

      function radioPrev() {
        if (stations.length === 0) return;
        currentStationIndex =
          (currentStationIndex - 1 + stations.length) % stations.length;
        radioPlayStation(currentStationIndex);
      }

      updateRadioUI();

      setInterval(fetchStatus, 500);
      fetchStatus();
    </script>
  </body>
</html>
